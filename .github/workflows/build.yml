name: Build APK
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Check the bundled AI model
        run: |
          # The model is stored in the repository. Fail the build if it is missing or damaged.
          M=app/src/main/assets/yamnet.tflite
          [ "$(stat -c%s $M)" -eq 4126810 ] || { echo "yamnet.tflite missing or wrong size"; exit 1; }
          echo "10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  $M" | sha256sum -c -
          [ -s app/src/main/assets/yamnet_class_map.csv ] || { echo "class map missing"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          # With the KEYSTORE_B64 secret the APK keeps a stable signature, so updates install over each other.
          # Without it (for example in a fork) Gradle falls back to its own debug key.
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/debug.keystore; echo "Using keystore from secret"; fi
      - run: gradle assembleDebug --no-daemon
      - name: Name the APK and print its signing fingerprint
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SnoreLog.apk
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs SnoreLog.apk | grep -E "certificate (DN|SHA-256)" || true
      - uses: actions/upload-artifact@v4
        with:
          name: SnoreLog-debug-apk
          path: SnoreLog.apk
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works whether the release already exists (created in the web UI) or not.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" SnoreLog.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" SnoreLog.apk --generate-notes --title "SnoreLog ${GITHUB_REF_NAME#v}"
          fi
